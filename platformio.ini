; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
default_envs = ShineWifiX, ShineWifiS, nodemcu-32s, lolin32, d1
src_dir = SRC/ShineWiFi-ModBus
extra_configs =
    platformio-local.ini

[env]
monitor_speed = 115200
upload_speed = 921600
build_flags =
    "-Wno-comment"
    ${sysenv.FIRMWARE_BUILD_FLAGS}
lib_deps =
    ArduinoOTA
    knolleary/PubSubClient@^2.8
    https://github.com/tzapu/WiFiManager#v2.0.17
    https://github.com/khoih-prog/ESP_DoubleResetDetector#v1.3.2
    https://github.com/bblanchon/ArduinoJson#v7.4.3
    ; Keep 1.04: newer tag 1.07 has a log-buffer overflow and changes web logging.
    https://github.com/dirkx/tee-log.git#1.04
    https://github.com/OpenInverterGateway/ModbusMaster#16d5f1f1cb4e1c9a7943425557a09ac9e89d624c
    https://github.com/bblanchon/ArduinoStreamUtils#v1.9.2


[env:ShineWifiX]
platform = espressif8266@4.2.1
board = esp07s
framework = arduino
lib_ldf_mode = deep+
lib_deps =
    ${env.lib_deps}
    vshymanskyy/Preferences@2.4.0
    bluemurder/ESP8266-ping@^2.0.1
build_flags =
    ${env.build_flags}
    "-D ENABLE_AP_BUTTON=1"
    ; Let BearSSL allocate TLS buffers from the shared IRAM heap.
    -DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED
extra_scripts = pre:extra_script.py

[env:ShineWifiS]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
lib_ldf_mode = deep+
lib_deps =
    ${env.lib_deps}
    vshymanskyy/Preferences@2.4.0
    bluemurder/ESP8266-ping@^2.0.1
build_flags =
    ${env.build_flags}
    "-D ENABLE_AP_BUTTON=1"
    -DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED

[env:d1]
platform = espressif8266@4.2.1
board = d1
framework = arduino
lib_ldf_mode = deep+
lib_deps =
    ${env.lib_deps}
    vshymanskyy/Preferences@2.4.0
    bluemurder/ESP8266-ping@^2.0.1
build_flags =
    ${env.build_flags}
    "-D ENABLE_AP_BUTTON=0"
    -DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED

[env:nodemcu-32s]
platform = espressif32@7.1.3
board = nodemcu-32s
framework = arduino
board_build.filesystem = littlefs
lib_deps =
    ${env.lib_deps}
    dvarrel/ESPping@^1.0.5
lib_ignore=LittleFS_esp32
build_flags =
    ${env.build_flags}

[env:lolin32]
platform = espressif32@7.1.3
board = lolin32
framework = arduino
board_build.filesystem = littlefs
lib_deps =
    ${env.lib_deps}
    dvarrel/ESPping@^1.0.5
lib_ignore=LittleFS_esp32
build_flags =
    ${env.build_flags}
